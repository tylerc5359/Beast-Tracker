# Builds the Windows and Mac installers on GitHub's machines and attaches them to a release.
# Runs whenever a version tag like v26.12.0 is pushed, or by hand from the Actions tab ("Run workflow").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and release (for example v26.11.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Beast Media Tracker ${{ inputs.tag || github.ref_name }}
          body: |
            **Windows:** download `Beast-Media-Tracker-Setup-….exe` and run it.
            **Mac:** download `Beast-Media-Tracker-…-mac.dmg`, open it and drag the app into Applications.

            The first time you open it, Windows or macOS may warn that the app is from an unknown developer.
            See [Installing](https://github.com/tylerc5359/Beast-Tracker#installing) for the one-time step to allow it.
          files: |
            dist/*.exe
            dist/*.dmg
